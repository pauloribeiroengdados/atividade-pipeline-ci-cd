name: CI - Validacao Estrutural HTML

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validar-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Instalar htmlhint
        run: npm install -g htmlhint

      - name: Verificar se o arquivo HTML existe
        run: |
          if [ ! -f "site/index.html" ]; then
            echo "ERRO: site/index.html não encontrado!"
            exit 1
          fi
          echo "Arquivo encontrado!"

      - name: Validar estrutura do HTML
        run: htmlhint site/index.html
        # Se houver erro estrutural, o workflow falha

      - name: Gerar artefato do site
        uses: actions/upload-artifact@v3
        with:
          name: site-build
          path: site/
