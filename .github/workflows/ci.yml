name: CI - Validacao Estrutural HTML

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validar-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar htmlhint
        run: npm install -g htmlhint

      - name: Listar estrutura do projeto
        run: |
          echo "Listando diretórios..."
          ls -R .

      - name: Validar existência do arquivo HTML
        run: |
          if [ ! -f "site/index.html" ]; then
            echo "ERRO: site/index.html não encontrado!"
            exit 1
          fi
          echo "Arquivo site/index.html encontrado!"

      - name: Validar se diretório 'site' contém arquivos
        run: |
          if [ -z "$(ls -A site)" ]; then
            echo "ERRO: a pasta 'site' está vazia. Artefato não será gerado."
            exit 1
          fi
          echo "Pasta 'site' possui arquivos."

      - name: Validar estrutura HTML
        run: htmlhint site/index.html

      - name: Gerar artefato do site
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: site/
