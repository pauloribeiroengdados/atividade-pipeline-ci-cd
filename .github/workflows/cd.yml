name: CD - Deploy no GitHub Pages

on:
  workflow_run:
    workflows: ["CI - Validacao Estrutural HTML"]
    types:
      - completed

permissions:
  contents: write
  pages: write
  actions: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Só executa se o CI tiver sido concluído com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Baixar artefato gerado pelo CI
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: site/
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.event.workflow_run.repository.full_name }}

      - name: Listar arquivos baixados
        run: |
          echo "Listando arquivos baixados:"
          ls -R site

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
