name: CD - Deploy no GitHub Pages

on:
  workflow_run:
    workflows: ["CI - Validacao Estrutural HTML"]
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Só executa se o workflow de CI tiver sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Baixar artefato gerado pelo CI
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: site/

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
