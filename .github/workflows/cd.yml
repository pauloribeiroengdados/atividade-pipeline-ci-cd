name: CD - Deploy no GitHub Pages - v3

on:
  workflow_run:
    workflows: ["CI - Validacao Estrutural HTML"]
    types: 
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Só continua se o CI foi bem-sucedido
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Baixar artefato do CI
        uses: actions/download-artifact@v3
        with:
          name: site-build
          path: site/

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
